# AUTH-02: Admin requires a real user JWT; public registration checks code server-side.
[functions.auth02-admin]
verify_jwt = true

[functions.auth02-register]
verify_jwt = false

# AUTH-05B: bearer user JWT is validated again against Auth inside the handler.
# The legacy public game remains active until the coordinated AUTH-07 cutover.
[functions.auth05-game]
verify_jwt = true
