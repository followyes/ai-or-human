name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run project tests
        run: npm run test

      - name: Build static site
        run: npm run build

      - name: Verify generated Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/js/content-source.js
          test ! -e dist/data/images.json
          test ! -d dist/images
          if grep -R "./data/images.json" dist/js dist/admin 2>/dev/null; then
            echo "Repository image fallback leaked into production artifact."
            exit 1
          fi
          echo "Supabase-only Pages artifact verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
