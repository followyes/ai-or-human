<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f3">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>AI or Human — Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%2320272d%27/%3E%3Ctext x=%2732%27 y=%2741%27 text-anchor=%27middle%27 font-family=%27Arial,sans-serif%27 font-size=%2730%27 font-weight=%27700%27 fill=%27white%27%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card" aria-labelledby="admin-title">
      <header class="admin-brand">
        <p class="admin-eyebrow">AI OR HUMAN</p>
        <h1 id="admin-title">Panel administratora</h1>
      </header>

      <section id="login-view">
        <p class="admin-copy">Zaloguj się kontem administratora.</p>

        <form id="login-form" class="login-form" novalidate>
          <label class="field">
            <span>E-mail</span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              required
            >
          </label>

          <label class="field">
            <span>Hasło</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button class="admin-primary-button" id="login-button" type="submit">
            Zaloguj
          </button>

          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="authorized-view" class="is-hidden" aria-live="polite">
        <div class="access-state">
          <span class="access-dot" aria-hidden="true"></span>
          <div>
            <strong>Dostęp administratora aktywny</strong>
            <p id="admin-email"></p>
          </div>
        </div>

        <div class="admin-placeholder">
          <p class="admin-eyebrow">CONTENT</p>
          <h2>Zarządzanie obrazami</h2>
          <p>Panel uploadu i konwersji AVIF zostanie podłączony w kolejnym etapie.</p>
        </div>

        <button class="admin-secondary-button" id="logout-button" type="button">
          Wyloguj
        </button>
      </section>

      <section id="boot-view" class="boot-state is-hidden" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p>Sprawdzanie sesji…</p>
      </section>
    </section>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
